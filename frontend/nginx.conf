upstream backend_api {
  server backend:3001;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;   # фото блюд с телефона (по умолчанию nginx режет всё, что больше 1 МБ)

  # Compresión (JSON de la API, JS, CSS, SVG)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  # Eventos en tiempo real (SSE): sin buffer y con conexión larga
  location = /api/events {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Фото блюд (загружаются в backend)
  location ^~ /uploads/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    expires 30d;
  }

  location /health {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Archivos con hash en el nombre: caché de 1 año
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Sonidos e imágenes: caché larga
  location ~* \.(ogg|png|webp|ico|svg)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Versión de la compilación: siempre fresca
  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # index.html nunca se cachea (para recibir versiones nuevas)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
