# Innova Office → https://office.innova365.kz
# Скопируйте в /etc/nginx/sites-available/office.innova365.kz, включите ссылкой в sites-enabled, затем выпустите сертификат:
#   sudo certbot --nginx -d office.innova365.kz      (certbot сам добавит HTTPS и редирект с http)
# Сервис office слушает только 127.0.0.1:8300 (см. docker-compose.yml), наружу он виден лишь через этот nginx.

server {
    listen 80;
    listen [::]:80;
    server_name office.innova365.kz;

    client_max_body_size 2m;

    # заголовки безопасности (HSTS certbot не добавляет — включите после проверки HTTPS)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # поток живых обновлений (SSE): без буферизации и с долгим соединением
    location = /api/events {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # по нему сервис ставит Secure на cookie входа
        proxy_read_timeout 60s;
    }
}
